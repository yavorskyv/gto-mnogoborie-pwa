<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>
    <linearGradient id="blueGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008BE2" />
      <stop offset="100%" stop-color="#005B9E" />
    </linearGradient>
    <linearGradient id="redGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="100%" stop-color="#D9141B" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)" stroke="#1E283D" stroke-width="8"/>
  
  <g transform="translate(131, 55)">
    <!-- Tricolor Shield -->
    <path d="M125 0 L220 50 L205 205 L125 265 L45 205 L30 50 Z" fill="#0E131E" stroke="#0078BF" stroke-width="6"/>
    <path d="M40 55 L125 15 L210 55 L205 105 L125 105 L45 105 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M45 105 L125 105 L205 105 L200 160 L125 160 L50 160 Z" fill="url(#blueGrad512)"/>
    <path d="M50 160 L125 160 L200 160 L190 200 L125 255 L60 200 Z" fill="url(#redGrad512)"/>

    <!-- Central Gold Star -->
    <circle cx="125" cy="130" r="54" fill="#0A0E17" stroke="url(#goldGrad512)" stroke-width="4"/>
    <polygon points="125,95 135,120 162,123 142,141 149,168 125,153 101,168 108,141 88,123 115,120" fill="url(#goldGrad512)" filter="url(#glow512)"/>
  </g>

  <text x="256" y="390" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    ФЕДЕРАЦИЯ МНОГОБОРЬЯ
  </text>
  <text x="256" y="435" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="3">
    <tspan fill="#008BE2">ГТО</tspan> <tspan fill="#ED1C24">РОССИИ</tspan>
  </text>
  <text x="256" y="468" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="15" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
    ОФИЦИАЛЬНЫЙ ВИД СПОРТА • GTO.COM.RU
  </text>
</svg>
